name: probe
# Throwaway: does a SMALL image push to the same target repo succeed?
# If yes, the 2.39GB size is the cause; if no, the repo/token is.
on: workflow_dispatch
env:
  REGISTRY: hkccr.ccs.tencentyun.com
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USER }}
          password: ${{ secrets.TCR_PASS }}
      - name: push a 4MB image to the target repo
        run: |
          set -x
          docker pull alpine:3.20
          docker tag alpine:3.20 ${{ env.REGISTRY }}/fd-web/mattermost:probe
          docker push ${{ env.REGISTRY }}/fd-web/mattermost:probe 2>&1 | tail -20
